name: Social-Media-Statistiken abrufen

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: social-stats-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Statistiken abrufen
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
        run: node scripts/fetch-social-stats.mjs

      - name: Statistik-Datei committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/social-stats.json content/social-stats-history.json content/social-post-stats-history.json content/social-posts
          if ! git diff --cached --quiet; then
            git commit -m "Social-Media-Statistiken aktualisiert"
            # Push kann fehlschlagen, wenn zeitgleich der Veröffentlichen-
            # Workflow gepusht hat (beide laufen alle 5 Minuten).
            for i in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "Push fehlgeschlagen (Versuch $i), hole Änderungen und versuche erneut..."
              git fetch origin master
              git rebase origin/master
              sleep 3
            done
            echo "Push endgültig fehlgeschlagen nach mehreren Versuchen."
            exit 1
          else
            echo "Keine Änderungen."
          fi
