<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Haus mit einem alten, moosigen Dach vor der Sanierung">
  <defs>
    <linearGradient id="skyV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f9aa3"/>
      <stop offset="100%" stop-color="#c3c9c6"/>
    </linearGradient>
    <clipPath id="roofClipV">
      <polygon points="600,120 1080,410 120,410"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="url(#skyV)"/>
  <rect x="0" y="540" width="1200" height="160" fill="#98a08f"/>

  <!-- Hecke -->
  <g fill="#7c8a70">
    <circle cx="120" cy="545" r="55"/>
    <circle cx="185" cy="555" r="45"/>
    <circle cx="1030" cy="550" r="60"/>
    <circle cx="1100" cy="560" r="42"/>
  </g>

  <!-- Hauswand -->
  <rect x="270" y="400" width="660" height="190" fill="#b7b0a2"/>
  <rect x="270" y="400" width="660" height="10" fill="#a39c8e"/>

  <!-- Dach: Tondach-Reihen, verwittert -->
  <g clip-path="url(#roofClipV)">
    <rect x="0" y="120" width="1200" height="290" fill="#8f8879"/>
    <g fill="#84806f">
      <rect x="0" y="150" width="1200" height="16"/>
      <rect x="0" y="182" width="1200" height="16"/>
      <rect x="0" y="214" width="1200" height="16"/>
      <rect x="0" y="246" width="1200" height="16"/>
      <rect x="0" y="278" width="1200" height="16"/>
      <rect x="0" y="310" width="1200" height="16"/>
      <rect x="0" y="342" width="1200" height="16"/>
      <rect x="0" y="374" width="1200" height="16"/>
    </g>
    <!-- Moos-Flecken -->
    <g fill="#6c7a4c" opacity="0.55">
      <ellipse cx="330" cy="330" rx="70" ry="26" transform="rotate(-6 330 330)"/>
      <ellipse cx="410" cy="360" rx="46" ry="18" transform="rotate(4 410 360)"/>
      <ellipse cx="250" cy="290" rx="40" ry="16"/>
      <ellipse cx="760" cy="240" rx="55" ry="20" transform="rotate(8 760 240)"/>
      <ellipse cx="830" cy="270" rx="34" ry="14"/>
    </g>
    <g fill="#57633c" opacity="0.5">
      <ellipse cx="345" cy="335" rx="30" ry="10"/>
      <ellipse cx="770" cy="245" rx="24" ry="9"/>
    </g>
    <!-- fehlende/verrutschte Ziegel -->
    <rect x="500" y="278" width="46" height="16" fill="#3f3a30"/>
    <rect x="640" y="342" width="40" height="16" fill="#6b6558"/>
  </g>
  <polygon points="600,120 1080,410 120,410" fill="none" stroke="#5c584c" stroke-width="6"/>

  <!-- First / Grat -->
  <line x1="600" y1="120" x2="600" y2="120" stroke="#5c584c" stroke-width="0"/>

  <!-- Schornstein -->
  <rect x="760" y="200" width="52" height="130" fill="#9b9284"/>
  <rect x="754" y="192" width="64" height="16" fill="#847c6c"/>

  <!-- Fenster -->
  <g>
    <rect x="330" y="450" width="90" height="90" fill="#7d8f97"/>
    <line x1="375" y1="450" x2="375" y2="540" stroke="#5f6a70" stroke-width="5"/>
    <line x1="330" y1="495" x2="420" y2="495" stroke="#5f6a70" stroke-width="5"/>
    <rect x="780" y="450" width="90" height="90" fill="#7d8f97"/>
    <line x1="825" y1="450" x2="825" y2="540" stroke="#5f6a70" stroke-width="5"/>
    <line x1="780" y1="495" x2="870" y2="495" stroke="#5f6a70" stroke-width="5"/>
  </g>

  <!-- Tuer -->
  <rect x="565" y="470" width="70" height="120" fill="#5f5748"/>
  <circle cx="622" cy="533" r="4" fill="#c9c2b2"/>

  <!-- Gehweg -->
  <polygon points="560,590 640,590 700,700 500,700" fill="#b9b9ae"/>
</svg>
