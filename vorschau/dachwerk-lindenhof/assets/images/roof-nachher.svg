<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Dasselbe Haus mit frisch saniertem Kupferrot-Dach nach der Sanierung">
  <defs>
    <linearGradient id="skyN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba86a"/>
      <stop offset="55%" stop-color="#eccb9a"/>
      <stop offset="100%" stop-color="#f3ddb9"/>
    </linearGradient>
    <linearGradient id="tileN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c96a34"/>
      <stop offset="100%" stop-color="#a94f24"/>
    </linearGradient>
    <clipPath id="roofClipN">
      <polygon points="600,120 1080,410 120,410"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="url(#skyN)"/>
  <rect x="0" y="540" width="1200" height="160" fill="#7f9a63"/>

  <!-- Hecke, gestutzt -->
  <g fill="#5f7a48">
    <circle cx="120" cy="540" r="55"/>
    <circle cx="185" cy="548" r="45"/>
    <circle cx="1030" cy="545" r="60"/>
    <circle cx="1100" cy="553" r="42"/>
  </g>

  <!-- Hauswand, frisch verputzt -->
  <rect x="270" y="400" width="660" height="190" fill="#eee7da"/>
  <rect x="270" y="400" width="660" height="10" fill="#16232e"/>

  <!-- Dach: neue Kupfer-Ziegel -->
  <g clip-path="url(#roofClipN)">
    <rect x="0" y="120" width="1200" height="290" fill="url(#tileN)"/>
    <g fill="#e07f45" opacity="0.9">
      <rect x="0" y="150" width="1200" height="8"/>
      <rect x="0" y="182" width="1200" height="8"/>
      <rect x="0" y="214" width="1200" height="8"/>
      <rect x="0" y="246" width="1200" height="8"/>
      <rect x="0" y="278" width="1200" height="8"/>
      <rect x="0" y="310" width="1200" height="8"/>
      <rect x="0" y="342" width="1200" height="8"/>
      <rect x="0" y="374" width="1200" height="8"/>
    </g>
    <g fill="#8a3f1c" opacity="0.6">
      <rect x="0" y="158" width="1200" height="4"/>
      <rect x="0" y="190" width="1200" height="4"/>
      <rect x="0" y="222" width="1200" height="4"/>
      <rect x="0" y="254" width="1200" height="4"/>
      <rect x="0" y="286" width="1200" height="4"/>
      <rect x="0" y="318" width="1200" height="4"/>
      <rect x="0" y="350" width="1200" height="4"/>
      <rect x="0" y="382" width="1200" height="4"/>
    </g>
    <!-- sanfter Glanzstreifen -->
    <polygon points="600,120 760,410 660,410" fill="#f3a56c" opacity="0.35"/>
  </g>
  <polygon points="600,120 1080,410 120,410" fill="none" stroke="#16232e" stroke-width="6"/>
  <line x1="600" y1="120" x2="600" y2="120" stroke="#16232e" stroke-width="0"/>

  <!-- Schornstein mit Kupferhaube -->
  <rect x="760" y="200" width="52" height="130" fill="#f2eee5"/>
  <rect x="752" y="190" width="68" height="18" fill="#c1662e"/>

  <!-- Fenster, neue Rahmen -->
  <g>
    <rect x="330" y="450" width="90" height="90" fill="#cfe3ea"/>
    <line x1="375" y1="450" x2="375" y2="540" stroke="#16232e" stroke-width="5"/>
    <line x1="330" y1="495" x2="420" y2="495" stroke="#16232e" stroke-width="5"/>
    <rect x="780" y="450" width="90" height="90" fill="#cfe3ea"/>
    <line x1="825" y1="450" x2="825" y2="540" stroke="#16232e" stroke-width="5"/>
    <line x1="780" y1="495" x2="870" y2="495" stroke="#16232e" stroke-width="5"/>
  </g>

  <!-- Tuer -->
  <rect x="565" y="470" width="70" height="120" fill="#16232e"/>
  <circle cx="622" cy="533" r="4" fill="#c1662e"/>

  <!-- Gehweg -->
  <polygon points="560,590 640,590 700,700 500,700" fill="#e7e3dc"/>
</svg>
