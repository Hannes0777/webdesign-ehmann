# ============================================================
#  Sveltia CMS – Konfiguration für Webdesign Ehmann
#  Bearbeitet werden JSON-Dateien im Ordner /content/
# ============================================================

backend:
  name: github
  repo: Hannes0777/webdesign-ehmann
  branch: master
  # Eigener Cloudflare-Worker nur für diese Website: E-Mail/Passwort-Login,
  # kein GitHub-Account nötig, kein Zugriff auf andere Websites möglich.
  base_url: https://cms-auth-webdesign-ehmann.ehmann-hannes07.workers.dev

media_folder: uploads
public_folder: /uploads

# Hochgeladene Dateinamen automatisch in URL-sichere Form bringen (Kleinbuchstaben,
# Bindestriche statt Leerzeichen/Sonderzeichen) - verhindert kaputte Bild-Links,
# wenn z.B. ein Foto direkt vom Handy mit Leerzeichen im Namen hochgeladen wird.
media_libraries:
  default:
    config:
      slugify_filename: true

locale: de

# ============================================================
#  SAMMLUNGEN
# ============================================================

collections:

  # ----------------------------------------------------------
  #  STARTSEITE – WILLKOMMENSBEREICH
  # ----------------------------------------------------------
  - name: hero
    label: "🏠 Startseite – Willkommensbereich"
    description: "Die große Einstiegsanimation ganz oben: die zwei Kopfzeilen, der Text auf der Karte und die 5 kleinen Info-Kacheln (Badges)."
    files:
      - name: hero
        label: "Willkommensbereich verwalten"
        file: content/hero.json
        fields:
          - name: title_line1
            label: "Hauptüberschrift – erste Zeile"
            widget: string
          - name: title_line2
            label: "Hauptüberschrift – zweite Zeile (goldener Verlauf)"
            widget: string
          - name: card_heading
            label: "Überschrift auf der Karte"
            widget: string
          - name: card_text
            label: "Text auf der Karte"
            widget: text
          - name: badges
            label: "Info-Kacheln (Badges)"
            label_singular: "Kachel"
            widget: list
            min: 5
            max: 5
            summary: "{{titel}}"
            fields:
              - name: icon
                label: "Symbol (Emoji)"
                widget: string
                hint: "Ein einzelnes Emoji, z.B. 📍 oder ⚡"
              - name: titel
                label: "Titel"
                widget: string
              - name: text
                label: "Kurzer Zusatztext"
                widget: string

  # ----------------------------------------------------------
  #  LEISTUNGEN / PAKETE
  # ----------------------------------------------------------
  - name: pakete
    label: "💼 Leistungen & Pakete"
    description: "Die 3 Pakete (Starter/Business/Premium) sowie die Zusatz-Hinweise zu CMS und Marketing-Leistungen."
    files:
      - name: pakete
        label: "Pakete verwalten"
        file: content/pakete.json
        fields:
          - name: sonderangebot_hinweis
            label: "Sonderangebot-Banner (über den Paketen)"
            widget: string
            hint: "Gut sichtbarer Hinweis, dass es sich um ein befristetes Einführungsangebot handelt, z.B. '🎉 Sonderangebot für die ersten Kunden — befristete Einführungspreise'."
          - name: preis_hinweis
            label: "Preishinweis (klein, über allen Paketen)"
            widget: string
            hint: "Erscheint als kleiner Hinweistext, z.B. 'Einführungspreis für die ersten Kunden'."
          - name: pakete
            label: "Pakete"
            label_singular: "Paket"
            widget: list
            min: 3
            max: 3
            summary: "{{name}}"
            fields:
              - name: name
                label: "Name (z.B. Starter/Business/Premium)"
                widget: string
              - name: regulaer_preis
                label: "Durchgestrichener regulärer Preis in Euro (nur Zahl, optional)"
                widget: string
                required: false
                hint: "Nur bei einem befristeten Einführungspreis ausfüllen, z.B. '250' — erscheint durchgestrichen vor dem Ab-Preis. Leer lassen für normale Preisanzeige ohne Streichpreis."
              - name: ab_preis
                label: "Ab-Preis in Euro (nur Zahl, ohne €-Zeichen)"
                widget: string
                required: false
                hint: "Leer lassen und stattdessen 'Preis-Text' nutzen, wenn kein fester Ab-Preis gezeigt werden soll (z.B. bei Premium 'Preis auf Anfrage')."
              - name: preis_text
                label: "Preis-Text (überschreibt Ab-Preis, z.B. 'Preis auf Anfrage')"
                widget: string
                required: false
              - name: preis_notiz
                label: "Kleiner Hinweis unter dem Preis (optional)"
                widget: string
                required: false
                hint: "Z.B. 'Nur für Neukunden' bei einem Einführungspreis. Leer lassen für keinen Zusatztext."
              - name: tagline
                label: "Kurzer Slogan"
                widget: string
              - name: empfohlen
                label: "Als 'empfohlen' hervorheben"
                widget: boolean
                default: false
              - name: leistungen
                label: "Enthaltene Leistungen"
                label_singular: "Leistung"
                widget: list
                field:
                  name: text
                  label: "Leistung"
                  widget: string
          - name: marketing_addon
            label: "Hinweis-Box: Marketing-Leistungen"
            widget: object
            fields:
              - name: titel
                label: "Titel"
                widget: string
              - name: text
                label: "Text"
                widget: text

  # ----------------------------------------------------------
  #  REZENSIONEN
  # ----------------------------------------------------------
  - name: rezensionen
    label: "⭐ Rezensionen"
    description: "Rückmeldungen von Kunden und Interessenten, erscheinen auf der Startseite."
    files:
      - name: rezensionen
        label: "Rezensionen verwalten"
        file: content/rezensionen.json
        fields:
          - name: eintraege
            label: "Rezensionen"
            label_singular: "Rezension"
            widget: list
            summary: "{{name}} ({{sterne}}★)"
            fields:
              - name: name
                label: "Name"
                widget: string
              - name: rolle
                label: "Kurzbeschreibung (z. B. Rolle oder Betrieb, optional)"
                widget: string
                required: false
                hint: "Erscheint klein unter dem Namen, z. B. „Interessent“ oder „Inhaberin, Café Sonne“."
              - name: text
                label: "Text der Rezension"
                widget: text
              - name: sterne
                label: "Sternebewertung (1–5)"
                widget: number
                value_type: int
                min: 1
                max: 5
                default: 5

  # ----------------------------------------------------------
  #  ÜBER MICH
  # ----------------------------------------------------------
  - name: uebermich
    label: "🙋 Über mich"
    files:
      - name: uebermich
        label: "Text & Ablauf verwalten"
        file: content/uebermich.json
        fields:
          - name: foto
            label: "Foto"
            widget: image
            required: false
            hint: "Rundes Porträtfoto, erscheint links neben dem Text. Leer lassen für die Kürzel-Kachel (HE)."
          - name: foto_ausschnitt
            label: "Bildausschnitt im Kreis"
            widget: string
            required: false
            default: "center"
            hint: "Mit dem Zieh-Werkzeug unter /admin/foto-position.html den Ausschnitt per Maus festlegen, den dort angezeigten Wert hier einfügen (z.B. „42% 63%“). Leer bzw. „center“ = Mitte."
          - name: absatz1
            label: "Erster Absatz"
            widget: text
          - name: absatz2
            label: "Zweiter Absatz"
            widget: text
          - name: werdegang
            label: "Werdegang & Motivation"
            widget: text
            required: false
            hint: "Kurzer Absatz zu Ausbildung/Werdegang und warum Sie Webdesign machen."
          - name: zitat
            label: "Kurzes Zitat (hervorgehoben dargestellt)"
            widget: string
            required: false
          - name: schritte
            label: "Ablauf in 3 Schritten"
            label_singular: "Schritt"
            widget: list
            min: 3
            max: 3
            summary: "{{titel}}"
            fields:
              - name: titel
                label: "Titel"
                widget: string
              - name: text
                label: "Beschreibungstext"
                widget: text

  # ----------------------------------------------------------
  #  MARKETING-LEISTUNGEN
  # ----------------------------------------------------------
  - name: marketing
    label: "📣 Marketing-Leistungen"
    description: "Social-Media-Betreuung, Flyer- und Logo-Design als Zusatzleistung."
    files:
      - name: marketing
        label: "Marketing-Leistungen verwalten"
        file: content/marketing.json
        fields:
          - name: titel
            label: "Überschrift"
            widget: string
          - name: text
            label: "Einleitungstext"
            widget: text
          - name: leistungen
            label: "Leistungen"
            label_singular: "Leistung"
            widget: list
            min: 3
            max: 3
            summary: "{{titel}}"
            fields:
              - name: titel
                label: "Titel"
                widget: string
              - name: text
                label: "Kurzbeschreibung"
                widget: string

  # ----------------------------------------------------------
  #  FACEBOOK & INSTAGRAM – BEITRÄGE PLANEN
  # ----------------------------------------------------------
  - name: social_posts
    label: "📱 Facebook & Instagram – Beiträge planen"
    description: "Beitrag anlegen, Bild(er) + Text eintragen und Zeitpunkt wählen — er wird automatisch veröffentlicht (Prüfung alle 5 Minuten). Facebook und Instagram können unterschiedliche Bilder bekommen, Text und Zeitpunkt gelten für beide gemeinsam. Bei einem Fehler erscheint eine Fehlermeldung am Eintrag, Status dann wieder auf „geplant“ setzen, um es erneut zu versuchen."
    folder: content/social-posts
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{text}} — {{geplant_fuer}}"
    sortable_fields: ["geplant_fuer", "status"]
    view_groups:
      - label: "Status"
        field: status
    view_filters:
      - label: "Nur geplant"
        field: status
        pattern: "geplant"
      - label: "Nur veröffentlicht"
        field: status
        pattern: "veroeffentlicht"
      - label: "Nur Fehler"
        field: status
        pattern: "fehler"
      - label: "Nur unterbrochen (prüfen!)"
        field: status
        pattern: "wird_veroeffentlicht"
    fields:
      - name: bild_facebook
        label: "Bild für Facebook"
        widget: image
        required: false
        media_folder: "social-media-tmp"
        public_folder: "/social-media-tmp"
        hint: "Genau ein Bild, das auf Facebook gepostet wird. Landet NICHT im normalen Uploads-Ordner der Homepage, sondern in einer separaten Ablage. Bleibt nach dem Veröffentlichen als Referenz im Beitrag sichtbar."
      - name: bilder_instagram
        label: "Bilder für Instagram"
        widget: image
        multiple: true
        required: false
        media_folder: "social-media-tmp"
        public_folder: "/social-media-tmp"
        hint: "Ein oder mehrere Bilder für Instagram — bei mehreren entsteht ein Karussell-Beitrag (max. 10 Bilder). Kann sich von Bild für Facebook unterscheiden. Nach dem Veröffentlichen bleibt nur das erste Bild als Referenz im Beitrag, weitere werden aufgeräumt."
      - name: text
        label: "Beitragstext"
        widget: text
      - name: facebook
        label: "Auf Facebook veröffentlichen"
        widget: boolean
        default: true
      - name: instagram
        label: "Auf Instagram veröffentlichen"
        widget: boolean
        default: true
      - name: geplant_fuer
        label: "Veröffentlichen am"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        hint: "Zeigt und speichert deine lokale Uhrzeit eindeutig mit Zeitzone, damit es keine Verwechslung mit UTC gibt."
      - name: status
        label: "Status"
        widget: select
        options: ["geplant", "wird_veroeffentlicht", "veroeffentlicht", "fehler"]
        default: "geplant"
        hint: "„wird_veroeffentlicht“ setzt der Workflow selbst kurz vor dem Posten. Bleibt ein Beitrag dauerhaft darauf stehen, wurde ein Lauf unterbrochen — erst manuell auf Facebook/Instagram prüfen, ob er schon online ist, dann erst auf „geplant“ zurücksetzen."
      - name: fehler_meldung
        label: "Fehlermeldung (wird automatisch befüllt)"
        widget: string
        required: false
      - name: facebook_post_id
        widget: hidden
        required: false
      - name: instagram_media_id
        widget: hidden
        required: false

  # ----------------------------------------------------------
  #  GEFOLGTE ACCOUNTS PROTOKOLLIEREN
  # ----------------------------------------------------------
  - name: follow_log
    label: "➕ Gefolgte Accounts protokollieren"
    description: "Trag ein, wann du wie vielen Accounts gefolgt bist (z.B. Firmen, die meistens zurückfolgen). Erscheint im Statistik-Dashboard als Markierung auf dem Follower-Diagramm, damit sichtbar wird, ob der Follower-Zuwachs damit zusammenhängt."
    folder: content/follow-log
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{anzahl}} gefolgt am {{datum}}"
    sortable_fields: ["datum"]
    fields:
      - name: datum
        label: "Datum"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD.MM.YYYY"
        time_format: false
        default: '{{now}}'
      - name: anzahl
        label: "Anzahl gefolgter Accounts"
        widget: number
        value_type: int
        min: 1
      - name: notiz
        label: "Notiz (optional)"
        widget: string
        required: false
        hint: "z.B. welche Art von Accounts (Firmen aus der Branche, ...)"

  # ----------------------------------------------------------
  #  CMS-ERKLÄRUNG
  # ----------------------------------------------------------
  - name: cms_erklaerung
    label: "🖥️ CMS-Erklärung"
    description: "Text im Bereich, der zeigt, wie das CMS-System aussieht und was es kann."
    files:
      - name: cms_erklaerung
        label: "CMS-Erklärung verwalten"
        file: content/cms-erklaerung.json
        fields:
          - name: titel
            label: "Überschrift"
            widget: string
          - name: text
            label: "Einleitungstext"
            widget: text
          - name: vorteile
            label: "Vorteile-Liste"
            label_singular: "Vorteil"
            widget: list
            field:
              name: text
              label: "Vorteil"
              widget: string

  # ----------------------------------------------------------
  #  KONTAKT
  # ----------------------------------------------------------
  - name: kontakt
    label: "✉️ Kontakt"
    files:
      - name: kontakt
        label: "Kontakt-E-Mail verwalten"
        file: content/kontakt.json
        fields:
          - name: email
            label: "E-Mail-Adresse"
            widget: string
            hint: "Wird überall auf der Website eingesetzt, wo eine E-Mail-Adresse verlinkt ist (Footer, Impressum, Datenschutz)."

  # ----------------------------------------------------------
  #  EINSTELLUNGEN
  # ----------------------------------------------------------
  - name: einstellungen
    label: "⚙️ Einstellungen"
    description: "Allgemeine Seiteninfos."
    files:
      - name: siteinfo
        label: "Allgemeine Seiteninfos"
        file: content/siteinfo.json
        fields:
          - name: site_title
            label: "Seitentitel (erscheint im Browser-Tab)"
            widget: string
          - name: meta_description
            label: "Kurzbeschreibung für Suchmaschinen"
            widget: text
            hint: "Ca. 150 Zeichen – wird von Google in den Suchergebnissen angezeigt."

  # ----------------------------------------------------------
  #  RECHTLICHES  (Angaben fürs Impressum)
  # ----------------------------------------------------------
  - name: rechtliches
    label: "⚖️ Rechtliches"
    description: "Angaben fürs Impressum und Datenschutzerklärung. Wichtig: Diese Felder unbedingt vor dem echten Online-Gang ausfüllen – solange ein Feld leer bleibt, erscheint dort ein auffällig gestalteter Hinweis-Platzhalter."
    files:
      - name: rechtliches
        label: "Impressum-Angaben verwalten"
        file: content/rechtliches.json
        fields:
          - name: strasse
            label: "Straße & Hausnummer"
            widget: string
            required: false
          - name: ort
            label: "PLZ & Ort"
            widget: string
            required: false
          - name: telefon
            label: "Telefonnummer"
            widget: string
            required: false
          - name: ustid
            label: "USt-IdNr. oder Kleinunternehmer-Hinweis"
            widget: string
            required: false
            hint: "Format DE + 9 Ziffern (z.B. DE123456789) - oder, falls keine USt-IdNr. vorhanden, ein Hinweis auf die Kleinunternehmerregelung nach § 19 UStG."
