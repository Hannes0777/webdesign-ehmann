<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS – Webdesign Ehmann</title>
  <!-- Sveltia CMS via CDN -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <style>
    #dashboard-link {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 9999;
      background: #d9ae5c;
      color: #14171a;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    #dashboard-link:hover { background: #b98f3f; }
  </style>
</head>
<body>
  <!-- Sveltia CMS initialises sich selbst aus /admin/config.yml -->
  <a id="dashboard-link" href="/admin/dashboard.html">📅 Kalender-Dashboard</a>
</body>
</html>
