# ============================================================
#  Sveltia CMS – INTERNE Daten (privates Repo webdesign-ehmann-intern)
#  Bearbeitet werden JSON-Dateien im Ordner /content/
# ============================================================

backend:
  name: github
  repo: Hannes0777/webdesign-ehmann-intern
  branch: master
  # Eigener Cloudflare-Worker nur für diese Website: E-Mail/Passwort-Login,
  # kein GitHub-Account nötig, kein Zugriff auf andere Websites möglich.
  base_url: https://cms-auth-webdesign-ehmann.ehmann-hannes07.workers.dev

media_folder: uploads
public_folder: /uploads

# Hochgeladene Dateinamen automatisch in URL-sichere Form bringen (Kleinbuchstaben,
# Bindestriche statt Leerzeichen/Sonderzeichen) - verhindert kaputte Bild-Links,
# wenn z.B. ein Foto direkt vom Handy mit Leerzeichen im Namen hochgeladen wird.
media_libraries:
  default:
    config:
      slugify_filename: true

locale: de

# ============================================================
#  SAMMLUNGEN
# ============================================================

collections:

  # ----------------------------------------------------------
  #  STARTSEITE – WILLKOMMENSBEREICH
  # ----------------------------------------------------------
  - name: social_posts
    label: "📱 Facebook & Instagram – Beiträge planen"
    description: "Beitrag anlegen, Bild(er) + Text eintragen und Zeitpunkt wählen — er wird automatisch veröffentlicht (Prüfung alle 5 Minuten). Facebook und Instagram können unterschiedliche Bilder bekommen, Text und Zeitpunkt gelten für beide gemeinsam. Bei einem Fehler erscheint eine Fehlermeldung am Eintrag, Status dann wieder auf „geplant“ setzen, um es erneut zu versuchen."
    folder: content/social-posts
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{text}} — {{geplant_fuer}}"
    sortable_fields: ["geplant_fuer", "status"]
    view_groups:
      - label: "Status"
        field: status
    view_filters:
      - label: "Nur geplant"
        field: status
        pattern: "geplant"
      - label: "Nur veröffentlicht"
        field: status
        pattern: "veroeffentlicht"
      - label: "Nur Fehler"
        field: status
        pattern: "fehler"
      - label: "Nur unterbrochen (prüfen!)"
        field: status
        pattern: "wird_veroeffentlicht"
    fields:
      - name: bild_facebook
        label: "Bild für Facebook"
        widget: image
        required: false
        media_folder: "social-media-tmp"
        public_folder: "/social-media-tmp"
        hint: "Genau ein Bild, das auf Facebook gepostet wird. Landet NICHT im normalen Uploads-Ordner der Homepage, sondern in einer separaten Ablage. Bleibt nach dem Veröffentlichen als Referenz im Beitrag sichtbar."
      - name: bilder_instagram
        label: "Bilder für Instagram"
        widget: image
        multiple: true
        required: false
        media_folder: "social-media-tmp"
        public_folder: "/social-media-tmp"
        hint: "Ein oder mehrere Bilder für Instagram — bei mehreren entsteht ein Karussell-Beitrag (max. 10 Bilder). Kann sich von Bild für Facebook unterscheiden. Nach dem Veröffentlichen bleibt nur das erste Bild als Referenz im Beitrag, weitere werden aufgeräumt."
      - name: text
        label: "Beitragstext"
        widget: text
      - name: facebook
        label: "Auf Facebook veröffentlichen"
        widget: boolean
        default: true
      - name: instagram
        label: "Auf Instagram veröffentlichen"
        widget: boolean
        default: true
      - name: geplant_fuer
        label: "Veröffentlichen am"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        hint: "Zeigt und speichert deine lokale Uhrzeit eindeutig mit Zeitzone, damit es keine Verwechslung mit UTC gibt."
      - name: status
        label: "Status"
        widget: select
        options: ["geplant", "wird_veroeffentlicht", "veroeffentlicht", "fehler"]
        default: "geplant"
        hint: "„wird_veroeffentlicht“ setzt der Workflow selbst kurz vor dem Posten. Bleibt ein Beitrag dauerhaft darauf stehen, wurde ein Lauf unterbrochen — erst manuell auf Facebook/Instagram prüfen, ob er schon online ist, dann erst auf „geplant“ zurücksetzen."
      - name: fehler_meldung
        label: "Fehlermeldung (wird automatisch befüllt)"
        widget: string
        required: false
      - name: facebook_post_id
        widget: hidden
        required: false
      - name: instagram_media_id
        widget: hidden
        required: false

  # ----------------------------------------------------------
  #  GEFOLGTE ACCOUNTS PROTOKOLLIEREN
  # ----------------------------------------------------------
  - name: follow_log
    label: "➕ Gefolgte Accounts protokollieren"
    description: "Trag ein, wann du wie vielen Accounts gefolgt bist (z.B. Firmen, die meistens zurückfolgen). Erscheint im Statistik-Dashboard als Markierung auf dem Follower-Diagramm, damit sichtbar wird, ob der Follower-Zuwachs damit zusammenhängt."
    folder: content/follow-log
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{anzahl}} gefolgt am {{datum}}"
    sortable_fields: ["datum"]
    fields:
      - name: datum
        label: "Datum"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD.MM.YYYY"
        time_format: false
        default: '{{now}}'
      - name: anzahl
        label: "Anzahl gefolgter Accounts"
        widget: number
        value_type: int
        min: 1
      - name: notiz
        label: "Notiz (optional)"
        widget: string
        required: false
        hint: "z.B. welche Art von Accounts (Firmen aus der Branche, ...)"

  # ----------------------------------------------------------
  #  CMS-ERKLÄRUNG
  # ----------------------------------------------------------
  - name: akquise
    label: "🤝 Akquise-Tracking"
    description: "Pro Firma ein Eintrag: Status (Neu/Priorisiert/Pitch-Demo gebaut/Kontaktiert/Kunde geworden/Verworfen), Quelle (Auto/Manuell), Daten angeschrieben/Antwort und Notizen."
    folder: content/akquise
    create: true
    extension: json
    format: json
    slug: "{{firma}}"
    summary: "{{firma}} — {{status}}"
    sortable_fields: ["status", "angeschrieben_am"]
    view_groups:
      - label: "Status"
        field: status
    fields:
      - name: firma
        label: "Firma"
        widget: string
      - name: status
        label: "Status"
        widget: select
        options: ["Neu", "Priorisiert", "Pitch-Demo gebaut", "Kontaktiert", "Kunde geworden", "Verworfen"]
        default: "Neu"
      - name: quelle
        label: "Quelle"
        widget: select
        options: ["Automatisch vorgeschlagen", "Manuell"]
        default: "Manuell"
      - name: kontaktiert
        label: "Kontaktiert"
        widget: boolean
        default: false
        required: false
      - name: demo_gebaut
        label: "Demo gebaut"
        widget: boolean
        default: false
        required: false
      - name: anschreiben_art
        label: "Anschreiben-Art"
        widget: select
        options: ["Erste E-Mail ohne Demo", "E-Mail mit Demo", "E-Mail ohne Demo, Angebot erwähnt", "E-Mail mit Demo, Angebot erwähnt"]
        required: false
        hint: "In welcher Form wurde angeschrieben (Demo/Angebot erwähnt) - unabhängig vom Status oben."
      - name: follow_up
        label: "Nachfass-Stand"
        widget: select
        options: ["1. Erinnerungsmail geschrieben", "2. Erinnerungsmail geschrieben", "Angerufen"]
        required: false
        hint: "Wie weit die Nachfass-Ansprache nach der Erstmail schon ist."
      - name: demo_gebaut_am
        label: "Demo gebaut am"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        required: false
      - name: angeschrieben_am
        label: "Angeschrieben am"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        required: false
      - name: antwort_am
        label: "Antwort erhalten am"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        required: false
      - name: antwort_status
        label: "Antwort-Status"
        widget: select
        options: ["—", "Positiv", "Absage", "Später"]
        default: "—"
        required: false
      - name: notiz
        label: "Notiz"
        widget: text
        required: false
      - name: firmenliste_ref
        label: "Firmenliste.md Referenz (optional)"
        widget: string
        required: false
        hint: "Name des Eintrags aus Firmenliste.md, z.B. ‚Physio Köpple'"

  # ----------------------------------------------------------
  #  TODOS
  # ----------------------------------------------------------
  - name: todos
    label: "✅ Todos"
    description: "Aufgabenliste mit Kategorien, Fälligkeitsdatum und Status (offen/erledigt)."
    folder: content/todos
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{text}}"
    sortable_fields: ["erledigt", "faellig_am"]
    view_filters:
      - label: "Offen"
        field: erledigt
        pattern: false
      - label: "Erledigt"
        field: erledigt
        pattern: true
    fields:
      - name: text
        label: "Aufgabe"
        widget: string
      - name: kategorie
        label: "Kategorie"
        widget: select
        options: ["Kunde", "Akquise", "Website", "Jarvis", "Sonstiges"]
        default: "Sonstiges"
      - name: erledigt
        label: "Erledigt"
        widget: boolean
        default: false
      - name: faellig_am
        label: "Fällig am"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        required: false
      - name: erstellt_am
        label: "Erstellt am"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        default: '{{now}}'

  # ----------------------------------------------------------
  #  PROJEKTE  (Business-Dashboard)
  # ----------------------------------------------------------
  - name: projekte
    label: "📁 Projekte"
    description: "Laufende Kundenprojekte mit Phase und Fortschritt — erscheinen als Fortschrittsbalken im Business-Dashboard."
    folder: content/projekte
    create: true
    extension: json
    format: json
    slug: "{{name}}"
    summary: "{{name}} — {{phase}}"
    sortable_fields: ["phase", "fortschritt"]
    fields:
      - name: name
        label: "Projektname"
        widget: string
      - name: phase
        label: "Phase"
        widget: select
        options: ["Konzept", "Demo gebaut", "Umsetzung", "Änderung von Kunde", "Abnahme", "Abgeschlossen"]
        default: "Konzept"
      - name: fortschritt
        label: "Fortschritt (%)"
        widget: number
        value_type: int
        min: 0
        max: 100
        default: 0
      - name: notiz
        label: "Notiz (optional)"
        widget: text
        required: false

  # ----------------------------------------------------------
  #  ANFRAGEN  (Business-Dashboard)
  # ----------------------------------------------------------
  - name: anfragen
    label: "📥 Anfragen"
    description: "Eingegangene Anfragen (z.B. per Mail/Telefon) protokollieren — erscheinen als Inbox im Business-Dashboard."
    folder: content/anfragen
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{absender}} — {{betreff}}"
    sortable_fields: ["eingegangen_am", "gelesen"]
    view_filters:
      - label: "Neu"
        field: gelesen
        pattern: false
      - label: "Gelesen"
        field: gelesen
        pattern: true
    fields:
      - name: absender
        label: "Absender / Firma"
        widget: string
      - name: betreff
        label: "Betreff"
        widget: string
      - name: eingegangen_am
        label: "Eingegangen am"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        default: '{{now}}'
      - name: gelesen
        label: "Bereits gelesen"
        widget: boolean
        default: false
      - name: notiz
        label: "Notiz (optional)"
        widget: text
        required: false

  # ----------------------------------------------------------
  #  RECHTLICHES  (Angaben fürs Impressum)
  # ----------------------------------------------------------
